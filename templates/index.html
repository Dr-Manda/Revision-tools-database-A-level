<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Revision Tracker</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #333;
            --accent: #2ecc71;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        select, input[type="text"], input[type="file"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background: #fff;
        }
        input[type="file"] {
            padding: 10px;
            background: #f9f9f9;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:active {
            background-color: #357abd;
        }
        .preview {
            margin-top: 15px;
            text-align: center;
        }
        #imagePreview {
            max-width: 100%;
            border-radius: 8px;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .success-msg {
            display: none;
            color: var(--accent);
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add Revision Item</h1>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="image">Question Photo</label>
                <input type="file" id="image" name="image" accept="image/*" capture="environment" required>
                <div class="preview">
                    <img id="imagePreview" src="" alt="Preview">
                </div>
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">Select Subject</option>
                </select>
            </div>

            <div class="form-group">
                <label for="topic">Topic</label>
                <select id="topic" name="topic" required>
                    <option value="">Select Topic</option>
                </select>
            </div>

            <div class="form-group">
                <label for="difficulty">Difficulty</label>
                <select id="difficulty" name="difficulty" required>
                    <option value="">Select Difficulty</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mistake">Mistake Description</label>
                <textarea id="mistake" name="mistake" rows="3" placeholder="What went wrong?"></textarea>
            </div>

            <div class="form-group">
                <label for="fix">Actionable Fix</label>
                <textarea id="fix" name="fix" rows="3" placeholder="How to avoid this next time?"></textarea>
            </div>

            <button type="submit">Save to Database</button>
            <div id="successMsg" class="success-msg">Successfully Saved!</div>
        </form>
    </div>

    <script>
        let config = {};

        // Load config from server
        fetch('/config')
            .then(res => res.json())
            .then(data => {
                config = data;
                const subjSelect = document.getElementById('subject');
                data.subjects.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = s;
                    subjSelect.appendChild(opt);
                });

                const diffSelect = document.getElementById('difficulty');
                data.difficulties.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d;
                    opt.textContent = d;
                    diffSelect.appendChild(opt);
                });
            });

        // Update topics when subject changes
        document.getElementById('subject').addEventListener('change', (e) => {
            const topicSelect = document.getElementById('topic');
            topicSelect.innerHTML = '<option value="">Select Topic</option>';
            const selectedSubject = e.target.value;
            if (config.topics[selectedSubject]) {
                config.topics[selectedSubject].forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    topicSelect.appendChild(opt);
                });
            }
        });

        // Image preview
        document.getElementById('image').addEventListener('change', (e) => {
            const preview = document.getElementById('imagePreview');
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (re) => {
                    preview.src = re.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        // Form submission
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const successMsg = document.getElementById('successMsg');
            
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const formData = new FormData(e.target);
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                if (response.ok) {
                    successMsg.style.display = 'block';
                    e.target.reset();
                    document.getElementById('imagePreview').style.display = 'none';
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 3000);
                } else {
                    alert('Error saving data');
                }
            } catch (err) {
                alert('Connection error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save to Database';
            }
        });
    </script>
</body>
</html>
